# Entorno local o staging completo: BUROFAST + PostgreSQL 16.
#   docker compose -f infrastructure/docker/docker-compose.yml --env-file <tu-archivo-de-variables> up --build
services:
  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
    environment:
      DATABASE_URL: postgres://burofast:${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD}@db:5432/burofast
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:?define DATA_ENCRYPTION_KEY}
      AUTH_SECRET: ${AUTH_SECRET:?define AUTH_SECRET}
      OWNER_EMAIL: ${OWNER_EMAIL:?define OWNER_EMAIL}
      OWNER_PASSWORD_HASH: ${OWNER_PASSWORD_HASH:?define OWNER_PASSWORD_HASH}
      HESTIA_CONTEXTO_TOKEN: ${HESTIA_CONTEXTO_TOKEN:-}
      HESTIA_EVENTOS_TOKEN: ${HESTIA_EVENTOS_TOKEN:-}
      HESTIA_WEBHOOK_SECRET: ${HESTIA_WEBHOOK_SECRET:-}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      HESTIA_WHATSAPP_NUMERO: ${HESTIA_WHATSAPP_NUMERO:-}
      N8N_BASE_URL: ${N8N_BASE_URL:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      BUROFAST_ENTORNO: ${BUROFAST_ENTORNO:-local}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 768m

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: burofast
      POSTGRES_USER: burofast
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD}
    volumes:
      - burofast-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U burofast -d burofast"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
    # Sin puerto publicado: la base de datos solo es accesible en la red interna.

volumes:
  burofast-db:
